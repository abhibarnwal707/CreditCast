seed: 42
n_loans: 50000

splits:
  train_end: 2014Q4
  val_start: 2015Q1
  val_end: 2016Q4
  oot_start: 2017Q1
  oot_end: 2019Q4
  covid_exclude: [2020Q1, 2021Q4]

scenario:
  jump_off: 2025Q4
  horizon_quarters: 13
  stress_horizon_quarters: 9
  max_loan_quarters: 120

fred_series: [UNRATE, USSTHPI, MORTGAGE30US, GDPC1, GS10]

macro:
  history_end: 2025Q4          # last realised quarter used for jump-off
  arima_eval_first_origin: 2000Q4
  arima_max_p: 3
  arima_max_q: 3
  long_run_start: 1990Q1       # long-run means computed from here to history_end
  reversion_quarters: 4        # linear reversion to long-run mean after the Fed 13 quarters
