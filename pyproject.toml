[project]
name = "creditcast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb", "pandas", "numpy", "scipy", "statsmodels", "scikit-learn", "xgboost",
  "pyarrow", "matplotlib", "pyyaml", "pdfplumber", "fredapi", "python-dotenv", "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
